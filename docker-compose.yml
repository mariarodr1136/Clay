services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: selfsoftware
      POSTGRES_PASSWORD: selfsoftware
      POSTGRES_DB: selfsoftware
    ports:
      - "5432:5432"
    volumes:
      - selfsoftware_pgdata:/var/lib/postgresql/data

volumes:
  selfsoftware_pgdata:
